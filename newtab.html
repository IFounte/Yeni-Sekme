<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yeni Sekme</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Arka Plan Katmanı ve Karartma Örtüsü -->
  <div id="bg-layer" class="bg-layer" aria-hidden="true"></div>
  <div id="bg-overlay" class="bg-overlay" aria-hidden="true"></div>

  <!-- Üst Bölüm: Canlı Saat -->
  <header class="top-section">
    <div class="clock-container" aria-live="off">
      <span id="clock-time" class="clock-time">00:00</span>
      <span id="clock-seconds" class="clock-seconds"></span>
      <span id="clock-period" class="clock-period"></span>
    </div>
  </header>

  <!-- Orta Bölüm: Google Arama ve Hızlı Erişim Linkleri -->
  <main class="center-section">
    <!-- Google Arama Çubuğu -->
    <div class="search-container">
      <form id="search-form" class="search-form" action="https://www.google.com/search" method="GET" autocomplete="off">
        <div class="search-box">
          <div class="search-icon-wrapper" aria-hidden="true">
            <svg class="google-icon" viewBox="0 0 24 24">
              <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/>
              <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24z"/>
              <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.99 0 12s.45 3.82 1.25 5.42l4.03-3.15z"/>
              <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
            </svg>
          </div>
          <input
            type="text"
            name="q"
            id="search-input"
            class="search-input"
            placeholder="Google'da arayın veya bir URL yazın..."
            autofocus
            spellcheck="false"
            aria-label="Google'da arayın"
          />
          <button type="button" id="search-clear-btn" class="search-clear-btn" title="Temizle" aria-label="Aramayı temizle">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
      </form>
    </div>

    <!-- Hızlı Erişim Linkleri Izgarası -->
    <section class="shortcuts-container" aria-label="Hızlı Erişim Linkleri">
      <div id="shortcuts-grid" class="shortcuts-grid">
        <!-- JS tarafından doldurulacak -->
      </div>
    </section>
  </main>

  <!-- Alt Bölüm: Sol Altta Tarih, Sağ Altta Özelleştir Butonu -->
  <footer class="bottom-section">
    <div class="bottom-left">
      <div id="date-display" class="date-display" aria-label="Güncel Tarih"></div>
    </div>
    <div class="bottom-right">
      <button type="button" id="customize-btn" class="customize-btn" title="Görünümü Özelleştir" aria-label="Özelleştir">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
        <span>Özelleştir</span>
      </button>
    </div>
  </footer>

  <!-- Özelleştirme Çekmecesi (Drawer) -->
  <div id="drawer-backdrop" class="drawer-backdrop" aria-hidden="true"></div>
  <aside id="customize-drawer" class="customize-drawer" aria-label="Özelleştirme Paneli">
    <div class="drawer-header">
      <h2>Görünümü Özelleştir</h2>
      <button type="button" id="close-drawer-btn" class="close-drawer-btn" title="Kapat" aria-label="Paneli kapat">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <div class="drawer-body">
      <!-- Özel Arka Plan Yükleme -->
      <section class="drawer-section">
        <h3>Özel Arka Plan Resmi</h3>
        <input type="file" id="wallpaper-file-input" accept="image/*" style="display: none;" />
        <div id="upload-drop-zone" class="upload-drop-zone" tabindex="0" role="button" aria-label="Resim seç veya sürükle">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="17 8 12 3 7 8"></polyline>
            <line x1="12" y1="3" x2="12" y2="15"></line>
          </svg>
          <span class="upload-text">Bilgisayarından Resim Yükle</span>
          <span class="upload-hint">Tıkla veya resmi buraya sürükle bırak</span>
        </div>
        <button type="button" id="reset-wallpaper-btn" class="danger-btn-outline">Varsayılan Arka Plana Sıfırla</button>
      </section>

      <!-- Hazır Arka Plan Gradyanları -->
      <section class="drawer-section">
        <h3>Hazır Temalar</h3>
        <div id="preset-list" class="preset-list">
          <!-- JS ile doldurulacak -->
        </div>
      </section>

      <!-- Görünüm İnce Ayarları -->
      <section class="drawer-section">
        <h3>Görünüm Ayarları</h3>
        <div class="setting-item">
          <div class="setting-label-row">
            <span>Karartma Opaklığı</span>
            <span id="opacity-value">35%</span>
          </div>
          <input type="range" id="opacity-slider" min="0" max="85" value="35" aria-label="Karartma Opaklığı" />
        </div>

        <div class="setting-item">
          <div class="setting-label-row">
            <span>Arka Plan Bulanıklığı</span>
            <span id="blur-value">0px</span>
          </div>
          <input type="range" id="blur-slider" min="0" max="20" value="0" aria-label="Bulanıklık Miktarı" />
        </div>
      </section>

      <!-- Saat Tercihleri -->
      <section class="drawer-section">
        <h3>Saat Ayarları</h3>
        <label class="toggle-item">
          <span>24 Saat Formatı</span>
          <div class="switch">
            <input type="checkbox" id="clock-format-toggle" checked />
            <span class="slider-round"></span>
          </div>
        </label>

        <label class="toggle-item">
          <span>Saniyeleri Göster</span>
          <div class="switch">
            <input type="checkbox" id="show-seconds-toggle" />
            <span class="slider-round"></span>
          </div>
        </label>
      </section>
    </div>
  </aside>

  <!-- Kısayol Ekleme / Düzenleme Modalı -->
  <dialog id="shortcut-dialog">
    <div class="dialog-card">
      <h3 id="dialog-title">Yeni Kısayol Ekle</h3>
      <form id="shortcut-form">
        <div class="form-group">
          <label for="shortcut-url-input">Web Sitesi Adresi (URL)</label>
          <input
            type="text"
            id="shortcut-url-input"
            placeholder="örnek: youtube.com veya https://..."
            required
            autocomplete="off"
          />
        </div>
        <div class="form-group">
          <label for="shortcut-title-input">Başlık (Opsiyonel)</label>
          <input
            type="text"
            id="shortcut-title-input"
            placeholder="örnek: YouTube"
            autocomplete="off"
          />
        </div>
        <div class="dialog-actions">
          <button type="button" id="cancel-dialog-btn" class="btn-secondary">İptal</button>
          <button type="submit" id="save-dialog-btn" class="btn-primary">Kaydet</button>
        </div>
      </form>
    </div>
  </dialog>

  <!-- JavaScript Giriş Noktası -->
  <script src="js/app.js"></script>
</body>
</html>
